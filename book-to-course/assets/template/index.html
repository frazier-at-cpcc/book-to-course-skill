<!doctype html>

<title>Kurs</title>

</head>
<body>
<div id="app">

    <button id="menuBtn" class="icon-btn" type="button" aria-label="Menu">☰</button>

    <div class="topbar-progress" title="Postęp">
      <div class="bar"><div id="globalBar" class="bar-fill"></div></div>

  <div class="shell">

    <main id="content" class="content" tabindex="-1"></main>

<script src="course/data.js"></script>
